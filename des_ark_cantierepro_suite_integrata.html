    const GeminiService = {

      async fetchWithRetry(url, options, maxRetries = 2) {
        let delay = 1000;
        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const res = await fetch(url, options);
            if (res.status === 429 && attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
            return res;
          } catch (err) {
            if (attempt === maxRetries) throw err;
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
          }
        }
      },

      async generateText({ prompt, systemInstruction, enableSearch = false }) {
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${this.apiKey}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }]
        };
        if (enableSearch) {
          payload.tools = [{ google_search: {} }];
        }
        if (systemInstruction) {
          payload.systemInstruction = { parts: [{ text: systemInstruction }] };
        }
        const res = await this.fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const candidate = data.candidates?.[0];
        const text = candidate?.content?.parts?.[0]?.text || "Nessun output generato.";
        let sources = [];
        if (candidate?.groundingMetadata?.groundingAttributions) {
          sources = candidate.groundingMetadata.groundingAttributions
            .map(a => ({ uri: a.web?.uri, title: a.web?.title || a.web?.uri }))
            .filter(s => s.uri && s.title);
        }
        return { text, sources };
      },

      async analyzePhoto({ prompt, base64Image, systemInstruction }) {
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${this.apiKey}`;
        const cleanBase64 = base64Image.replace(/^data:image\/[a-zA-Z]+;base64,/, '');
        const payload = {
          contents: [{
            parts: [
              { text: prompt },
              { inlineData: { mimeType: "image/jpeg", data: cleanBase64 } }
            ]
          }]
        };
        if (systemInstruction) {
          payload.systemInstruction = { parts: [{ text: systemInstruction }] };
        }
        const res = await this.fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Impossibile analizzare l'immagine.";
      }

          )}

          {/* Modal Nuova Variante con Foto */}
          {isNewVarianteModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0b1022] border border-amber-500/40 rounded-3xl w-full max-w-lg p-6 space-y-4 shadow-2xl">
                <h3 className="font-bold text-white text-base">Registra Nuova Perizia di Variante</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const nuova = {
                    id: `var-${Date.now()}`,
                    protocollo: `VAR-2026-${String((currentCantiere.varianti || []).length + 1).padStart(2, '0')}`,
                    data: new Date().toISOString().split('T')[0],
                    titolo: newVarianteForm.titolo,
                    inquadramento: newVarianteForm.inquadramento,
                    motivazione: newVarianteForm.motivazione,
                    deltaImporto: Number(newVarianteForm.deltaImporto) || 0,
                    prorogaGiorni: Number(newVarianteForm.prorogaGiorni) || 0,
                    foto: newVarianteForm.foto,
                    statoCliente: "In Valutazione D.L.",
                    noteDL: "Sopralluogo programmato per verifica congruenza prezzi Puglia 2026."
                  };
                  setCantieri(prev => prev.map(c => c.id === currentCantiere.id ? { ...c, varianti: [nuova, ...(c.varianti || [])] } : c));
                  setIsNewVarianteModalOpen(false);
                  showToast('Richiesta registrata con successo!');
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1">Oggetto della Modifica</label>
                    <input
                      type="text"
                      required
                      placeholder="Es. Spostamento punto luce e aggiunta presa a pavimento"
                      value={newVarianteForm.titolo}
                      onChange={(e) => setNewVarianteForm({ ...newVarianteForm, titolo: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                    />
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Motivazione</label>
                    <textarea
                      rows={2}
                      required
                      placeholder="Descrivi la richiesta o il dettaglio tecnico..."
                      value={newVarianteForm.motivazione}
                      onChange={(e) => setNewVarianteForm({ ...newVarianteForm, motivazione: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 block mb-1">Delta Importo (€)</label>
                      <input
                        type="number"
                        value={newVarianteForm.deltaImporto}
                        onChange={(e) => setNewVarianteForm({ ...newVarianteForm, deltaImporto: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Proroga Giorni (gg)</label>
                      <input
                        type="number"
                        value={newVarianteForm.prorogaGiorni}
                        onChange={(e) => setNewVarianteForm({ ...newVarianteForm, prorogaGiorni: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Carica Fotografia dal Sopralluogo</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onload = (ev) => setNewVarianteForm(prev => ({ ...prev, foto: ev.target?.result }));
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white file:bg-amber-500 file:text-slate-950 file:border-0 file:rounded-lg file:px-2 file:py-1 file:text-xs file:font-bold"
                    />
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsNewVarianteModalOpen(false)} className="bg-slate-800 px-4 py-2 rounded-xl text-xs">Annulla</button>
                    <button type="submit" className="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">Invia</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Emetti Certificato di Pagamento CdP */}
          {isNewCdPModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0b1022] border border-emerald-500/40 rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <h3 className="font-bold text-white text-base">Emetti Certificato di Pagamento (CdP)</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const netto = Number(newCdPForm.importoLavoriNetto) || 0;
                  const sic = Number(newCdPForm.quotaSicurezzaPSC) || 0;
                  const rit = (netto + sic) * 0.005;
                  const imponibile = (netto + sic) - rit;
                  const iva = imponibile * 0.10;
                  const tot = imponibile + iva;
                  const nuovo = {
                    id: `cdp-${Date.now()}`,
                    numero: Number(newCdPForm.numero),
                    data: new Date().toISOString().split('T')[0],
                    importoLavoriNetto: netto,
                    quotaSicurezzaPSC: sic,
                    ritenutaGaranzia: Number(rit.toFixed(2)),
                    iva10: Number(iva.toFixed(2)),
                    totaleCertificato: Number(tot.toFixed(2)),
                    stato: "In Emissione",
                    note: newCdPForm.note
                  };
                  setCantieri(prev => prev.map(c => c.id === currentCantiere.id ? { ...c, certificatiPagamento: [...(c.certificatiPagamento || []), nuovo] } : c));
                  setIsNewCdPModalOpen(false);
                  showToast(`Certificato di Pagamento n. ${nuovo.numero} emesso!`);
                }} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 block mb-1">Numero CdP</label>
                      <input
                        type="number"
                        value={newCdPForm.numero}
                        onChange={(e) => setNewCdPForm({ ...newCdPForm, numero: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Quota Sicurezza (€)</label>
                      <input
                        type="number"
                        value={newCdPForm.quotaSicurezzaPSC}
                        onChange={(e) => setNewCdPForm({ ...newCdPForm, quotaSicurezzaPSC: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Importo Lavori Netti (€)</label>
                    <input
                      type="number"
                      required
                      value={newCdPForm.importoLavoriNetto}
                      onChange={(e) => setNewCdPForm({ ...newCdPForm, importoLavoriNetto: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono"
                    />
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Note Tecniche SAL</label>
                    <textarea
                      rows={2}
                      value={newCdPForm.note}
                      onChange={(e) => setNewCdPForm({ ...newCdPForm, note: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white"
                    />
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsNewCdPModalOpen(false)} className="bg-slate-800 px-4 py-2 rounded-xl text-xs">Annulla</button>
                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs">Emetti CdP</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Nuovo Rapporto Giornale */}
          {isNewGiornaleModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0b1022] border border-amber-500/40 rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <h3 className="font-bold text-white text-base">Registra Rapporto Giornale Lavori</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const nuovo = {
                    id: `gl-${Date.now()}`,
                    data: newGiornaleForm.data,
                    meteo: newGiornaleForm.meteo,
                    operai: Number(newGiornaleForm.operai),
                    imprese: newGiornaleForm.imprese,
                    attivita: newGiornaleForm.attivita,
                    ordiniDL: newGiornaleForm.ordiniDL
                  };
                  setCantieri(prev => prev.map(c => c.id === currentCantiere.id ? { ...c, giornale: [nuovo, ...(c.giornale || [])] } : c));
                  setIsNewGiornaleModalOpen(false);
                  showToast('Rapporto registrato nel Giornale Lavori.');
                }} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 block mb-1">Data</label>
                      <input
                        type="date"
                        value={newGiornaleForm.data}
                        onChange={(e) => setNewGiornaleForm({ ...newGiornaleForm, data: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">N. Operai</label>
                      <input
                        type="number"
                        value={newGiornaleForm.operai}
                        onChange={(e) => setNewGiornaleForm({ ...newGiornaleForm, operai: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Meteo</label>
                    <input
                      type="text"
                      value={newGiornaleForm.meteo}
                      onChange={(e) => setNewGiornaleForm({ ...newGiornaleForm, meteo: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                    />
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Lavorazioni Eseguite</label>
                    <textarea
                      rows={3}
                      required
                      value={newGiornaleForm.attivita}
                      onChange={(e) => setNewGiornaleForm({ ...newGiornaleForm, attivita: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                    />
                  </div>
                  <div>
                    <label className="text-amber-400 block mb-1 font-bold">Ordini di Servizio D.L.</label>
                    <textarea
                      rows={2}
                      value={newGiornaleForm.ordiniDL}
                      onChange={(e) => setNewGiornaleForm({ ...newGiornaleForm, ordiniDL: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white"
                    />
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsNewGiornaleModalOpen(false)} className="bg-slate-800 px-4 py-2 rounded-xl text-xs">Annulla</button>
                    <button type="submit" className="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">Registra</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } catch (err) {
      console.error("Mounting error:", err);
      document.getElementById('root').innerHTML = `
        <div class="p-8 text-rose-400 bg-slate-950 font-mono text-xs">
          Errore di caricamento: ${err.message}<br/>
          <button onclick="localStorage.clear();location.reload();" class="mt-4 px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">
            Ripristina Dati Iniziali
          </button>
        </div>
      `;
    }
  </script>
</body>
</html>
